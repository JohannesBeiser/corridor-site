<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A shared location — Corridor</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="../favicon.png" type="image/png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<style>
  :root { --paper:#FBFAF7; --ink:#1C1F21; --faint:#6B7276; --hair:#DBD8D2; --orange:#F28C21; }
  @media (prefers-color-scheme: dark) {
    :root { --paper:#101314; --ink:#E6E8E9; --faint:#9AA1A5; --hair:#2C3235; }
  }
  html { background: var(--paper); }
  body {
    font-family: "Avenir Next", "Segoe UI", system-ui, sans-serif;
    color: var(--ink); background: var(--paper);
    max-width: 30rem; margin: 0 auto; padding: 3rem 1.25rem 4rem;
    line-height: 1.55; font-size: 17px; text-align: center;
  }
  .dot { width: 14px; height: 14px; border-radius: 50%; background: var(--orange);
         box-shadow: 0 0 0 3px #fff; display: inline-block; margin-bottom: 1rem; }
  h1 { font-size: 1.5rem; margin: 0 0 .75rem; }
  p { color: var(--faint); margin: 0 0 1rem; }
  a.button { display: inline-block; margin-top: 1rem; padding: .7rem 1.3rem; border-radius: 999px;
             background: var(--ink); color: var(--paper); text-decoration: none; font-weight: 600; }
</style>
</head>
<body>
  <span class="dot"></span>
  <h1>Someone is sharing their location with you</h1>
  <p>This link opens in the Corridor app on iPhone, and only for the Apple ID it was made for. Install Corridor, then tap the link again.</p>
  <a class="button" href="https://apps.apple.com/app/id6801537739">Get Corridor</a>
</body>
</html>
